<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/cadastrarEntrega.js"defer></script>
    <title>Cadastro de Entrega</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
        </nav>
    </header>
    <main>
        <h1>Cadastro de Entrega</h1>

        <form>
            <label for="cidadeDestino">Cidade de Destino</label>
            <input type="text" id="cidadeDestino" placeholder="cidadeDestino" required><br><br>

            <label for="statusAtual">Status Atual</label>
            <select name="statusAtual" id="statusAtual">
                <option value="TRANSITO">Transito</option>
                <option value="ENTREGUE">Entregue</option>
            </select>

            <label for="dataHora">Data e Hora</label>
            <input type="datetime-local" id="dataHora" placeholder="dataHora" required maxlength="11"><br><br>

            <label for="idCarga">Código da Carga</label>
            <input type="text" id="idCarga" placeholder="idCarga" required><br><br>

            <button type="submit" id="btn_cadastrar">Cadastrar</button>
        </form>

        <div id="resposta"></div>
    </main>
</body>
</html>
