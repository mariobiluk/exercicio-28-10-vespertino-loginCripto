<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/cadastrarCarga.js"defer></script>
    <title>Cadastro de Carga</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
        </nav>
    </header>
    <main>
        <h1>Cadastro de Carga</h1>

        <form>
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" placeholder="descricao" required><br><br>

            <label for="peso">Peso (Kg)</label>
            <input type="text" id="peso" placeholder="peso" required><br><br>

            <label for="volume">Volume (L)</label>
            <input type="text" id="volume" placeholder="volume" required maxlength="11"><br><br>

            <label for="codRastreio">Código de Rastreio</label>
            <input type="text" id="codRastreio" placeholder="codRastreio" required><br><br>

            <label for="idMotorista">Código do Motorista</label>
            <input type="text" id="idMotorista" placeholder="idMotorista" required><br><br>

            <button type="submit" id="btn_cadastrar">Cadastrar</button>
        </form>

        <div id="resposta"></div>
    </main>
</body>
</html>
