<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/cadastrarMotorista.js"defer></script>
    <title>Cadastro de Motorista</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
        </nav>
    </header>
    <main>
        <h1>Cadastro de Motorista</h1>

        <form>
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="nome" required><br><br>

            <label for="cnh">Número da CNH</label>
            <input type="text" id="cnh" placeholder="cnh" required><br><br>

            <label for="cpf">CPF (11 Dígitos)</label>
            <input type="text" id="cpf" placeholder="cpf" required maxlength="11"><br><br>

            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="telefone" required><br><br>

            <button type="submit" id="btn_cadastrar">Cadastrar</button>
        </form>

        <div id="resposta"></div>
    </main>
</body>
</html>
